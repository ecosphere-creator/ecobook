name: ecobook
domain: ecobook
version: 1.1.0
category: Content
publisher: getecosphere
status: unverified
license: mit
summary: "Ecobook — a reusable portrait book reader (Phaser.js) with a Rust axum book API and portable markdown deck-document import/export"

targets:
  - linux/amd64

artifacts: {}

contract:
  version: 1
  api: "ecobook REST API (/api/book, /api/book/:id, /api/book/catalog, /api/ecobook-files/*)"
  env:
    required:
      - SERVER_PORT
      - MONGODB_URI
      - JWT_SECRET
    optional:
      - API_BASE_URL
      - CORS_ALLOWED_ORIGINS
      - AUTH_BASE_URL
      - PAYMENTS_BASE_URL
      - COMMUNITY_BASE_URL
      - STORAGE_BACKEND
      - STORAGE_LOCAL_PATH
      - S3_ENDPOINT
      - S3_REGION
      - S3_BUCKET
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
      - RATE_LIMIT_GENERAL_BURST
      - RATE_LIMIT_GENERAL_REPLENISH_SECS
  db: mongodb@7
  network:
    inbound: [http]
    outbound: [http]
  resources:
    memory: "256m"
    disk: "512m"
    startup_seconds: 5

runtime:
  base: self-contained-static
  libc: musl
  dependencies: []

provenance:
  source: ""
  commit: ""
  built_by: ""
  built_at: ""
  target: x86_64-unknown-linux-musl

release: []
